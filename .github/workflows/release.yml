name: 發行 Windows 桌面版

# 改好 version.json 的版本號推上 main，就會自動建置並發一版 Release
on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 讀取版本號
        id: ver
        shell: pwsh
        run: |
          # 一定要指定 UTF8，否則 Windows PowerShell 會用系統編碼讀，中文會壞掉
          $v = (Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $code = Select-String -Path desktop\app.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' |
                  ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($v -ne $code) { throw "version.json ($v) 與 desktop/app.py 的 APP_VERSION ($code) 不一致" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本 $v"

      - name: 安裝相依套件
        run: python -m pip install -r server/requirements.txt -r server/requirements-stt.txt pywebview pyinstaller

      - name: 取得 ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ff.zip"
          Expand-Archive "$env:TEMP\ff.zip" -DestinationPath "$env:TEMP\ff"
          Get-ChildItem "$env:TEMP\ff" -Recurse -Include ffmpeg.exe, ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName ffmpeg -Force }

      - name: 打包
        run: python -m PyInstaller desktop/app.spec --noconfirm --distpath dist --workpath build

      - name: 產生安裝檔
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss

      - name: 壓成免安裝版
        shell: pwsh
        run: |
          Compress-Archive -Path dist\XiaokeYouTube\* `
            -DestinationPath "dist\XiaokeYouTube-portable-v${{ steps.ver.outputs.version }}.zip"

      - name: 發行 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 小柯機器人 YouTube 下載工具 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/XiaokeYouTube-Setup-v${{ steps.ver.outputs.version }}.exe
            dist/XiaokeYouTube-portable-v${{ steps.ver.outputs.version }}.zip
