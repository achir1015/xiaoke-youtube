name: 發行 Windows 桌面版

# 改好 version.json 的版本號推上 main，就會自動建置並發一版 Release
on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 讀取版本號
        id: ver
        shell: pwsh
        run: |
          # 一定要指定 UTF8，否則 Windows PowerShell 會用系統編碼讀，中文會壞掉
          $v = (Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $code = Select-String -Path desktop\app.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' |
                  ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($v -ne $code) { throw "version.json ($v) 與 desktop/app.py 的 APP_VERSION ($code) 不一致" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本 $v"

      - name: 安裝相依套件
        run: python -m pip install -r server/requirements.txt -r server/requirements-stt.txt pywebview pyinstaller

      - name: 取得 ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ff.zip"
          Expand-Archive "$env:TEMP\ff.zip" -DestinationPath "$env:TEMP\ff"
          Get-ChildItem "$env:TEMP\ff" -Recurse -Include ffmpeg.exe, ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName ffmpeg -Force }

      - name: 打包
        run: python -m PyInstaller desktop/app.spec --noconfirm --distpath dist --workpath build

      - name: 產生安裝檔
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss

      - name: 壓成免安裝版
        shell: pwsh
        run: |
          Compress-Archive -Path dist\XiaokeYouTube\* `
            -DestinationPath "dist\XiaokeYouTube-portable-v${{ steps.ver.outputs.version }}.zip"

      - name: 發行 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 小柯機器人 YouTube 下載工具 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/XiaokeYouTube-Setup-v${{ steps.ver.outputs.version }}.exe
            dist/XiaokeYouTube-portable-v${{ steps.ver.outputs.version }}.zip

  linux:
    needs: windows          # 兩個 job 都往同一個 tag 丟檔案，排隊避免打架
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Qt WebEngine 需要的系統套件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcomposite1 \
            libxdamage1 libxrandr2 libegl1
          # Ubuntu 24.04 叫 libasound2t64，22.04 叫 libasound2
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: 建置
        run: bash desktop/build-linux.sh --with-ffmpeg

      - name: 發行 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          files: dist/XiaokeYouTube-linux-x86_64-v${{ needs.windows.outputs.version }}.tar.gz

  mac:
    needs: windows          # 跟其他 job 丟同一個 tag，排在 Windows 建好 Release 之後
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple 晶片（arm64）
            arch: arm64
          - runner: macos-15-intel    # Intel（x86_64）
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 建置 .dmg
        run: bash desktop/build-mac.sh

      - name: 發行 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          files: dist/XiaokeYouTube-mac-${{ matrix.arch }}-v${{ needs.windows.outputs.version }}.dmg

  android:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 正式發行一定要用固定金鑰簽：用 debug 簽章發出去的 APK，裝了的人之後就再也無法更新。
      # 所以缺任何一個 secret、或金鑰解不開，都直接讓這一步失敗，而不是默默退回 debug 簽章。
      - name: 準備簽章金鑰
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ]     || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]    || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PW" ]       || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少這些 repository secrets：$missing（請到 Settings → Secrets and variables → Actions → Repository secrets 設定）"
            exit 1
          fi
          # 貼上時常會夾帶換行或空白，先清掉再解碼
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/xiaoke.jks" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 不是有效的 base64，可能複製時少了一段"; exit 1; }
          echo "金鑰檔大小：$(stat -c %s "$RUNNER_TEMP/xiaoke.jks") bytes"
          keytool -list -keystore "$RUNNER_TEMP/xiaoke.jks" -storetype PKCS12 \
            -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null || {
            echo "::error::金鑰打不開：ANDROID_KEYSTORE_PASSWORD 或 ANDROID_KEY_ALIAS 不對"; exit 1; }
          echo "keystore=$RUNNER_TEMP/xiaoke.jks" >> "$GITHUB_OUTPUT"

      - name: 編譯 release APK
        working-directory: android
        env:
          XK_KEYSTORE: ${{ steps.sign.outputs.keystore }}
          XK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 確認 APK 是正式簽章
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk)"
          echo "$certs" | grep -E "DN:|SHA-256 digest"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK 是 debug 簽章，不能發行"; exit 1
          fi

      - name: 改成好認的檔名
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/XiaokeYouTube-v${{ needs.windows.outputs.version }}.apk"

      - name: 發行 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          files: dist/XiaokeYouTube-v${{ needs.windows.outputs.version }}.apk
