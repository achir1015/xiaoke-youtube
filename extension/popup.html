<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>小柯機器人 下載平台設定</title>
<style>
  body { width: 330px; margin: 0; padding: 14px; background: #171d27; color: #e8edf4;
         font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; font-size: 13px; }
  h1 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 24px; height: 24px; }
  p.hint { color: #94a3b8; font-size: 11.5px; margin: 0 0 12px; }
  ul { list-style: none; margin: 0 0 10px; padding: 0; }
  li { border: 1px solid #2a3342; border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; background: #0f141c; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row input[type=radio] { accent-color: #ff3b30; }
  .nm { font-weight: 700; flex: 1; min-width: 0; }
  .base { color: #94a3b8; font-size: 11px; word-break: break-all; margin: 4px 0 0 24px; }
  .st { font-size: 11px; margin: 4px 0 0 24px; color: #94a3b8; }
  .st.ok { color: #34d399; } .st.err { color: #ff6b61; }
  .acts { display: flex; gap: 6px; margin: 6px 0 0 24px; }
  button { border: 1px solid #2a3342; background: transparent; color: #94a3b8; border-radius: 8px;
           padding: 5px 9px; font-size: 11px; cursor: pointer; font-family: inherit; }
  button:hover { color: #e8edf4; border-color: #38bdf8; }
  button.primary { background: #ff3b30; border-color: #ff3b30; color: #fff; font-weight: 700; }
  input[type=text] { width: 100%; padding: 8px 9px; border-radius: 8px; border: 1px solid #2a3342;
                     background: #0f141c; color: #e8edf4; font-size: 12px; margin-bottom: 6px; }
  .add { border-top: 1px solid #2a3342; padding-top: 10px; }
  .lbl { color: #94a3b8; font-size: 11px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt="">小柯機器人 下載平台</h1>
  <p class="hint">選一個平台當作預設，YouTube 頁面上的小圖示就會把下載分派過去。</p>
  <ul id="list"></ul>
  <div class="add">
    <span class="lbl">新增平台</span>
    <input type="text" id="name" placeholder="名稱，例如：NAS、工作電腦">
    <input type="text" id="base" placeholder="http://127.0.0.1:8787">
    <button class="primary" id="add">新增</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
